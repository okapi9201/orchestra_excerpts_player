<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orchestra Excerpt Player</title>
<style>
body{font-family:sans-serif;max-width:1000px;margin:auto;padding:12px}
.card{border:1px solid #ddd;border-radius:12px;padding:12px;margin:10px 0}
input,button,textarea{padding:8px;margin:4px}
input[type=text],textarea{width:100%;box-sizing:border-box}
.item{border:1px solid #ccc;border-radius:8px;padding:8px;margin:6px 0}
</style>
</head>
<body>
<h1>Orchestra Excerpt Player</h1>
<p>GitHub Pages 配置用単一ファイル版</p>
<div class="card">
<label>前余白 <input id="padBefore" type="number" value="0"></label>
<label>後余白 <input id="padAfter" type="number" value="0"></label>
<button onclick="share()">共有URL生成</button>
<textarea id="shareUrl"></textarea>
</div>
<div class="card">
<input id="composer" placeholder="作曲者">
<input id="title" placeholder="曲名">
<input id="url" placeholder="YouTube URL">
<input id="start" placeholder="開始 12:34">
<input id="end" placeholder="終了 13:21">
<button onclick="addItem()">追加</button>
</div>
<div class="card"><div id="list"></div></div>
<script>
let items=[];
function parseTime(v){const p=v.split(':').map(Number);if(p.length===1)return p[0]||0;if(p.length===2)return p[0]*60+p[1];return p[0]*3600+p[1]*60+p[2];}
function addItem(){
 items.push({composer:composer.value,title:title.value,url:url.value,start:start.value,end:end.value});
 render(); localStorage.setItem('oep',JSON.stringify(items));
}
function render(){
 list.innerHTML=items.map((x,i)=>`<div class=item><b>${x.composer}</b><br>${x.title}<br>${x.start}-${x.end}</div>`).join('');
}
function share(){
 const payload=btoa(unescape(encodeURIComponent(JSON.stringify({items,padBefore:padBefore.value,padAfter:padAfter.value}))));
 shareUrl.value=location.origin+location.pathname+'#'+payload;
}
try{items=JSON.parse(localStorage.getItem('oep')||'[]');render();}catch(e){}
</script>
</body>
</html>
