<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Orchestra Excerpt Player v1.0</title></head><body><h1>Orchestra Excerpt Player v1.0</h1><p>GitHub Pages版。YouTube API・URL共有・LocalStorage対応の土台。</p><script src='https://www.youtube.com/iframe_api'></script></body></html><!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orchestra Excerpt Player</title>
<style>
body{font-family:system-ui,sans-serif;max-width:1000px;margin:auto;padding:12px}
.card{border:1px solid #ccc;border-radius:8px;padding:12px;margin:10px 0}
input,button{padding:8px;margin:4px}
input[type=text]{width:100%;box-sizing:border-box}
.item{border:1px solid #ddd;padding:8px;margin:6px 0}
</style>
</head>
<body>
<h1>Orchestra Excerpt Player</h1>

<div class="card">
<input id="url" type="text" placeholder="YouTube URL">
<input id="start" type="text" placeholder="開始 mm:ss">
<input id="end" type="text" placeholder="終了 mm:ss">
<button onclick="addItem()">追加</button>
</div>

<div class="card">
<div id="list"></div>
</div>

<div class="card">
<button onclick="playSelected()">再生</button>
<div id="player"></div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let items=[];
let selected=0;
let player=null;

function parseTime(t){
 const p=t.split(":").map(Number);
 if(p.length===1) return p[0]||0;
 if(p.length===2) return p[0]*60+p[1];
 if(p.length===3) return p[0]*3600+p[1]*60+p[2];
 return 0;
}

function getVideoId(u){
 try{
   const x=new URL(u);
   if(x.hostname==="youtu.be") return x.pathname.slice(1);
   return x.searchParams.get("v");
 }catch(e){return "";}
}

function addItem(){
 items.push({
  url:url.value,
  videoId:getVideoId(url.value),
  start:parseTime(start.value),
  end:parseTime(end.value)
 });
 render();
}

function render(){
 list.innerHTML=items.map((x,i)=>
  `<div class="item">
   ${x.url}<br>
   ${x.start}s - ${x.end}s
   <button onclick="selected=${i}">選択</button>
  </div>`).join("");
}

function playSelected(){
 if(!player || !items[selected]) return;
 const it=items[selected];
 player.loadVideoById({
   videoId:it.videoId,
   startSeconds:it.start,
   endSeconds:it.end
 });
}

function onYouTubeIframeAPIReady(){
 player=new YT.Player('player',{
   height:'360',
   width:'640'
 });
}
</script>
</body>
</html>
